name: Release

# Tag-triggered release: builds the controller image, pushes it to GHCR, and
# cuts a GitHub Release from the tag. Runs on `v*` tag pushes only -- it never
# runs on a branch push, so it cannot race the version-bump automation in
# other workflows.
#
# NOTE: this workflow has never been exercised by an actual tag push (no `v*`
# tag exists on this repo yet). The first real run is what proves the GHCR
# login/push and release-notes generation actually work end to end; until
# then, treat it as reviewed-but-unverified. See docs/wiki/guides/releasing.md
# for what to check if that first run fails, and keep changes to this file
# small and easy to bisect for exactly that reason.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Workflow-wide default is read-only, matching every other workflow in this
# repo (ci.yml, operability.yml, emulator-change-gates.yml, ...). The one job
# that needs to push images/create a release grants exactly those extra
# scopes itself, rather than widening this default.
permissions:
  contents: read

jobs:
  release:
    name: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub Release from the tag
      packages: write  # to push images to ghcr.io
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from the tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cross-check tag against pyproject [project] version
        run: |
          pyproject_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$pyproject_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.version.outputs.version }} does not match pyproject version ${pyproject_version} -- bump pyproject.toml and re-tag"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Controller image: the root Dockerfile (FastAPI/Typer app). This is the
      # only image this workflow builds -- see the Dockerfile.web note below.
      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/amantux/openblade:${{ steps.version.outputs.version }}
            ghcr.io/amantux/openblade:latest

      # `Dockerfile.web` is not tracked on master as of this workflow's
      # authoring (only `frontend/Dockerfile` exists, consumed by
      # docker-compose's `web` service, not published standalone to GHCR).
      # If/when a top-level `Dockerfile.web` is added for a standalone web
      # image, add a matching build-push step here tagged
      # `ghcr.io/amantux/openblade-web:{version,latest}` -- do not invent one
      # now.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
