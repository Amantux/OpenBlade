name: Hardware nightly read-only

# Read-only lane against the physical Scalar i3 (docs/runbooks/hardware-lanes.md).
# Every test in tests/hardware/readonly/ is read-only by construction (an AST
# safety test in that directory rejects load/unload/move/format/mount calls).
# The before/after snapshot diff is the runtime proof that nothing moved.
#
# Without a rig (HARDWARE_RIG_AVAILABLE != 'true') the hardware job is SKIPPED
# and the no-rig job writes a NOT RUN summary. The run then concludes
# *success* even though nothing was verified, so this lane must never be a
# required check or a badge (docs/runbooks/hardware-lanes.md).

on:
  schedule:
    # 02:17 UTC nightly. Odd minute: top-of-hour schedules queue behind everyone.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-rig-notice:
    name: no-rig-notice
    if: vars.HARDWARE_RIG_AVAILABLE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record that the lane did not run
        run: |
          {
            echo "## Hardware nightly read-only: NOT RUN (neutral)"
            echo
            echo "No i3 rig is registered for this repository (repo variable HARDWARE_RIG_AVAILABLE is not 'true'),"
            echo "so the read-only hardware job was skipped. This is not a pass: nothing was verified against the appliance."
            echo "See docs/runbooks/hardware-lanes.md to register the self-hosted runner."
          } >> "$GITHUB_STEP_SUMMARY"

  readonly:
    name: hardware-readonly
    if: vars.HARDWARE_RIG_AVAILABLE == 'true'
    runs-on: [self-hosted, i3]
    # Job-level, so only a job that actually holds the rig takes the lock.
    # Shared with the destructive lane and the smoke subset: a read-only pass
    # must never observe a destructive run mid-sequence.
    concurrency:
      group: hardware-rig-i3
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      OPENBLADE_BACKEND: real
      OPENBLADE_REAL_HARDWARE_ENABLED: "true"
      # Pinned: a runner-host dry-run setting would make the lane a no-op.
      OPENBLADE_HARDWARE_DRY_RUN: "false"
      OPENBLADE_APPLIANCE_URL: ${{ vars.OPENBLADE_APPLIANCE_URL }}
      OPENBLADE_APPLIANCE_USER: ${{ vars.OPENBLADE_APPLIANCE_USER }}
      OPENBLADE_APPLIANCE_PASSWORD: ${{ secrets.OPENBLADE_APPLIANCE_PASSWORD }}
      OPENBLADE_APPLIANCE_INSECURE: ${{ vars.OPENBLADE_APPLIANCE_INSECURE }}
      OPENBLADE_DIFFERENTIAL_REPORT: differential-report.json
      I3_AML_USER: ${{ secrets.QUANTUM_AML_USER }}
      I3_AML_PASSWORD: ${{ secrets.QUANTUM_AML_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -e '.[dev]'

      # A rig lane must never go green by skipping: the rig tests skip when
      # these are unset, so refuse to run without them. OPENBLADE_CHANGER_DEVICE
      # and OPENBLADE_DRIVE_DEVICES come from the runner host's environment.
      - name: Preflight — rig configuration present
        run: |
          set -euo pipefail
          missing=()
          for v in OPENBLADE_APPLIANCE_URL OPENBLADE_APPLIANCE_USER OPENBLADE_APPLIANCE_PASSWORD OPENBLADE_CHANGER_DEVICE OPENBLADE_DRIVE_DEVICES; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::rig lane misconfigured, missing: ${missing[*]}"
            exit 1
          fi

      # No allowlist step: this lane names no cartridges and performs no
      # motion. The snapshot diff below is what would catch a violation.
      - name: Snapshot inventory + drive state (before)
        run: |
          set -euo pipefail
          mkdir -p snapshots
          python -m tools.hardware.snapshot capture --out snapshots/before.json

      - name: Run the read-only suite
        run: |
          set -euo pipefail
          python -m pytest tests/hardware/readonly/ -m real_hardware -v --tb=short -rs \
            --junitxml=readonly-results.xml

      # Runs only after the suite succeeded (no `if: always()`): catches a
      # green-by-skipping run. Add `--expected-skip classname::name` only with
      # a comment saying why that skip is legitimate on the rig.
      - name: Gate — fail on any skip or zero passes
        run: python -m tools.hardware.junit_gate readonly-results.xml

      - name: Snapshot inventory + drive state (after) and diff
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f snapshots/before.json ]; then
            echo "::warning::No before-snapshot was captured; nothing to diff."
            exit 0
          fi
          python -m tools.hardware.snapshot capture --out snapshots/after.json
          python -m tools.hardware.snapshot diff snapshots/before.json snapshots/after.json --out snapshots/diff.json

      - name: Upload results, differential report and snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: hardware-readonly-${{ github.run_id }}
          path: |
            readonly-results.xml
            differential-report.json
            snapshots/
          if-no-files-found: warn
