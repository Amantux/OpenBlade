# Nightly lanes that are too slow or too noisy for the PR path. Not a required
# PR check. Every lane is blocking within this workflow (no continue-on-error):
# a red nightly is a real regression to triage the next morning.
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"   # odd minute: top-of-hour schedules queue behind everyone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow:
    # Tests excluded from full-suite by `not slow`.
    name: nightly-slow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Slow-marked tests
        run: pytest -m "slow and not real_hardware and not real_i3" -q --tb=short

  stress:
    # Fault-injection suite plus any stress-marked test elsewhere.
    name: nightly-stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Fault-injection suite
        run: pytest tests/fault -q --tb=short
      - name: Stress-marked tests outside tests/fault
        run: |
          # Exit 5 = no tests collected: legitimate while nothing outside
          # tests/fault carries the marker. Any other non-zero exit fails.
          rc=0
          pytest tests --ignore=tests/fault -m "stress and not real_hardware and not real_i3" -q --tb=short || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  fuzz:
    # Property-based (hypothesis) suite.
    name: nightly-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Property tests
        run: pytest tests/property -q --tb=short

  rebuild:
    # Catalog rebuild from tape (incl. the worker).
    name: nightly-rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Catalog rebuild tests
        run: pytest tests/unit/test_catalog_rebuild.py tests/unit/test_catalog_rebuild_worker.py -q --tb=short

  mutation:
    # mutmut over the safety-critical modules; fails on new survivors vs mutation/baseline.txt.
    name: nightly-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Install mutmut
        run: pip install mutmut==3.8.0
      - name: Mutation run
        run: bash tools/mutation_run.sh
