name: Quantum hardware smoke

# Dispatchable subset of hardware-nightly-readonly.yml: the same read-only
# suite (tests/hardware/readonly/), on demand, on the same rig.
#
# Why kept rather than deleted: the workflow name and the job id
# `register-and-validate` are kept so any branch-protection rule or status
# check that references them keeps resolving. The old ubuntu-latest job could
# not reach a physical library anyway; the real check needs the [self-hosted, i3]
# runner (docs/runbooks/hardware-lanes.md). Motion/control-plane inputs were
# removed on purpose: motion belongs to hardware-destructive.yml, behind the
# environment approval and the cartridge allowlist.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional pytest -k expression to narrow the read-only suite"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  no-rig-notice:
    name: no-rig-notice
    if: vars.HARDWARE_RIG_AVAILABLE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record that the smoke did not run
        run: |
          {
            echo "## Quantum hardware smoke: NOT RUN (neutral)"
            echo
            echo "HARDWARE_RIG_AVAILABLE is not 'true', so register-and-validate was skipped."
            echo "This is not a pass. See docs/runbooks/hardware-lanes.md."
          } >> "$GITHUB_STEP_SUMMARY"

  register-and-validate:
    name: register-and-validate
    if: vars.HARDWARE_RIG_AVAILABLE == 'true'
    runs-on: [self-hosted, i3]
    # Job-level, so only a job that actually holds the rig takes the lock.
    concurrency:
      group: hardware-rig-i3
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      OPENBLADE_BACKEND: real
      OPENBLADE_REAL_HARDWARE_ENABLED: "true"
      # Pinned: a runner-host dry-run setting would make the lane a no-op.
      OPENBLADE_HARDWARE_DRY_RUN: "false"
      OPENBLADE_APPLIANCE_URL: ${{ vars.OPENBLADE_APPLIANCE_URL }}
      OPENBLADE_APPLIANCE_USER: ${{ vars.OPENBLADE_APPLIANCE_USER }}
      OPENBLADE_APPLIANCE_PASSWORD: ${{ secrets.OPENBLADE_APPLIANCE_PASSWORD }}
      OPENBLADE_APPLIANCE_INSECURE: ${{ vars.OPENBLADE_APPLIANCE_INSECURE }}
      OPENBLADE_DIFFERENTIAL_REPORT: differential-report.json
      I3_AML_USER: ${{ secrets.QUANTUM_AML_USER }}
      I3_AML_PASSWORD: ${{ secrets.QUANTUM_AML_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -e '.[dev]'

      # A rig lane must never go green by skipping: the rig tests skip when
      # these are unset, so refuse to run without them. OPENBLADE_CHANGER_DEVICE
      # and OPENBLADE_DRIVE_DEVICES come from the runner host's environment.
      - name: Preflight — rig configuration present
        run: |
          set -euo pipefail
          missing=()
          for v in OPENBLADE_APPLIANCE_URL OPENBLADE_APPLIANCE_USER OPENBLADE_APPLIANCE_PASSWORD OPENBLADE_CHANGER_DEVICE OPENBLADE_DRIVE_DEVICES; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::rig lane misconfigured, missing: ${missing[*]}"
            exit 1
          fi

      - name: Snapshot inventory + drive state (before)
        run: |
          set -euo pipefail
          mkdir -p snapshots
          python -m tools.hardware.snapshot capture --out snapshots/before.json

      - name: Run the read-only suite
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          args=(tests/hardware/readonly/ -m real_hardware -v --tb=short -rs --junitxml=readonly-results.xml)
          if [ -n "$TEST_FILTER" ]; then
            args+=(-k "$TEST_FILTER")
          fi
          python -m pytest "${args[@]}"

      # Runs only after the suite succeeded (no `if: always()`): catches a
      # green-by-skipping run. A -k filter deselects (absent from the XML),
      # it does not skip, so it cannot trip this gate.
      - name: Gate — fail on any skip or zero passes
        run: python -m tools.hardware.junit_gate readonly-results.xml

      - name: Snapshot inventory + drive state (after) and diff
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f snapshots/before.json ]; then
            echo "::warning::No before-snapshot was captured; nothing to diff."
            exit 0
          fi
          python -m tools.hardware.snapshot capture --out snapshots/after.json
          python -m tools.hardware.snapshot diff snapshots/before.json snapshots/after.json --out snapshots/diff.json

      - name: Upload results, differential report and snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: hardware-smoke-${{ github.run_id }}
          path: |
            readonly-results.xml
            differential-report.json
            snapshots/
          if-no-files-found: warn
