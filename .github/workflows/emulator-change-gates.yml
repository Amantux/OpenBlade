name: emulator-change-gates

on:
  pull_request:
    paths:
      - "openblade/simulator/**"
      - "openblade/api/main.py"
      - "openblade/api/aml_state.py"
      - "openblade/api/aml_latency.py"
      - "openblade/api/aml_scope.py"
      - "openblade/api/routes_aml_*.py"
      - "openblade/api/routes_aml_matrix_fallback.py"
      - "openblade/api/routes_iblade.py"
      - "openblade/config.py"
      - "openblade/emulator_contract/**"
      - "deploy/emulator/**"
      - "scripts/emulator/**"
      - "tools/emulator_spec/**"
      - "tests/i3/**"
      - "tests/integration/test_aml_*.py"
      - "tests/integration/test_multi_library.py"
      - "tests/integration/test_library_commands.py"
      - "tests/unit/test_emulator_client_config.py"
      - "docker-compose.yml"
  push:
    branches: [master]
    paths:
      - "openblade/simulator/**"
      - "openblade/api/main.py"
      - "openblade/api/aml_state.py"
      - "openblade/api/aml_latency.py"
      - "openblade/api/aml_scope.py"
      - "openblade/api/routes_aml_*.py"
      - "openblade/api/routes_aml_matrix_fallback.py"
      - "openblade/api/routes_iblade.py"
      - "openblade/config.py"
      - "openblade/emulator_contract/**"
      - "deploy/emulator/**"
      - "scripts/emulator/**"
      - "tools/emulator_spec/**"
      - "tests/i3/**"
      - "tests/integration/test_aml_*.py"
      - "tests/integration/test_multi_library.py"
      - "tests/integration/test_library_commands.py"
      - "tests/unit/test_emulator_client_config.py"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The cross-repo contract (openblade/emulator_contract/contract.json) pins this
  # exact command to this workflow file, so it stays here as an explicit step in
  # addition to the reusable workflow's own validation.
  contract-metadata:
    name: contract-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 tools/emulator_spec/validate_cross_repo_contract.py

  emulator-contract:
    name: emulator-contract
    needs: contract-metadata
    # './' is GitHub's documented local reusable-workflow syntax and what actionlint validates.
    uses: ./.github/workflows/_emulator-boot-test.yml  # zizmor: ignore[self-repository]
    with:
      timing_profile: instant
      db_name: openblade-emulator-gates
      pytest_args: >-
        tests/i3/test_14_emulator_profile.py
        tests/i3/test_18_config_profiles.py
        tests/i3/test_15_manual_matrix_contract.py
        tests/i3/test_16_manual_matrix_generated_suites.py
        tests/i3/test_17_matrix_endpoint_coverage.py
        tests/integration/test_aml_emulator_latency*.py
        tests/integration/test_aml_scope_lockdown.py
        tests/integration/test_aml_library_spec_parity.py
        tests/unit/test_emulator_client_config.py
        -q --tb=short
      followup_pytest_args: tests/i3/ -m i3 -q --tb=short
