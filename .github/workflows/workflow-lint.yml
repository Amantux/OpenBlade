# Static checks for the workflows themselves: actionlint (incl. shellcheck on
# every inline run: block), zizmor (security audit) and yamllint.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".yamllint"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".yamllint"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release checksums.txt
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install zizmor and yamllint (pinned)
        run: python -m pip install zizmor==1.30.1 yamllint==1.38.0
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (+ shellcheck on run blocks; shellcheck is preinstalled on ubuntu runners)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: zizmor
        run: zizmor --no-progress --min-severity low .github/workflows/
      - name: yamllint
        run: yamllint -c .yamllint .github/workflows/
