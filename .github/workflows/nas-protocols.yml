name: NAS protocols

# Nightly / manual only. Deliberately NOT a pull_request or push check: the rig
# builds Samba + NFS-Ganesha containers and needs a privileged client container.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  protocols:
    name: smb-nfs-protocol-rig
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - name: Start protocol rig
        run: make protocols-up
      - name: Run protocol tests
        run: make test-protocols
      - name: Dump rig logs
        if: failure()
        run: |
          mkdir -p protocol-logs
          docker compose -f deploy/nas-protocols/docker-compose.yml ps > protocol-logs/ps.txt 2>&1 || true
          docker compose -f deploy/nas-protocols/docker-compose.yml logs --no-color > protocol-logs/compose.log 2>&1 || true
      - name: Upload rig logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nas-protocols-logs
          path: protocol-logs/
          if-no-files-found: warn
      - name: Tear down protocol rig
        if: always()
        run: make protocols-down
