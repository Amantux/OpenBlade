#
# mhvtl.conf — OpenBlade rehearsal rig
#

# Home directory for tape emulation files
MHVTL_HOME_PATH=/opt/mhvtl

# Default media capacity, in MB.
#
# mhvtl's own default is 500. That is too small for this suite: the archive,
# sharded and performance tests write 100 MB payloads and several of them in a
# row, and a 500 MB cartridge fails part way through with
#   OSError: [Errno 28] No space left on device
# from inside the LTFS mount — which looks like an OpenBlade bug and is not.
#
# 8000 MB gives plenty of headroom. The backing files are sparse and grow only
# as data is written, so the cost on disk is what you actually write, not 8 GB
# per cartridge.
#
# NOTE: this is read by make_vtl_media at media CREATION time. Changing it does
# not resize cartridges that already exist — run
#   sudo scripts/mhvtl/teardown.sh --purge && sudo scripts/mhvtl/setup.sh
# to rebuild the media at the new capacity.
CAPACITY=8000

# Set default verbosity [0|1|2|3]
VERBOSE=1

# Set kernel module debugging [0|1]
VTL_DEBUG=0

# vtltape and vtllibrary debugging [Blank or -d]
#DAEMON_DEBUG=-d
