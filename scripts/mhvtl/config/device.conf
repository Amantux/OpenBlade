
VERSION: 5

# OpenBlade mhvtl rehearsal rig — Phase 2 of docs/runbooks/real-i3-bringup-plan.md
#
# ONE library: 1 medium changer + 3 LTO-8 drives.
#
# Why "QUANTUM Scalar" and not "Scalar i3":
#   mhvtl picks its medium-changer personality module in
#   usr/cmd/vtllibrary.c:customise_lu() by matching the *product id*
#   (not the vendor id) against "QUANTUM" / "ADIC". A product id of
#   "Scalar i3" — which is what a real Quantum Scalar i3 actually reports —
#   falls through to init_default_smc() and gets completely different SCSI
#   element addresses. We want the Scalar personality, because its element
#   addressing is the realistic case:
#
#       personality      start_drive   start_map   start_storage
#       scalar_pm        0x0100 (256)  0x0010      0x1000 (4096)
#       default_smc_pm   0x0001        0x0300      0x0400 (1024)
#
#   Rehearsing against the Scalar numbers is the whole point: it proves the
#   backend never assumes slots are 0- or 1-based. See scripts/mhvtl/README.md.

Library: 10 CHANNEL: 00 TARGET: 00 LUN: 00
 Vendor identification: QUANTUM
 Product identification: QUANTUM Scalar
 Unit serial number: OBLADE_L10
 NAA: 10:22:33:44:ab:00:00:00
 Home directory: /opt/mhvtl
 PERSIST: False
 Backoff: 400

Drive: 11 CHANNEL: 00 TARGET: 01 LUN: 00
 Library ID: 10 Slot: 01
 Vendor identification: IBM
 Product identification: ULT3580-TD8
 Product revision level: HB81
 Unit serial number: OBLADE_D01
 NAA: 10:22:33:44:ab:00:01:00
 Compression: factor 1 enabled 1
 Compression type: lzo
 Backoff: 400

