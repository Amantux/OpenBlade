services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENBLADE_BACKEND: mock
      OPENBLADE_DB_URL: sqlite:////data/openblade.db
      OPENBLADE_EMULATOR_URLS: ${OPENBLADE_EMULATOR_URLS:-http://host.docker.internal:8010,http://host.docker.internal:8011,http://host.docker.internal:8012}
    volumes:
      - openblade-data:/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Published i3 emulator image (cross-repo contract pin — validated by
  # tools/emulator_spec/validate_cross_repo_contract.py). Off by default:
  # `docker compose --profile emulator up` runs it; the default stack is
  # unchanged. The standalone fleet launcher (deploy/emulator/) remains the
  # local-build path.
  emulator:
    image: ${OPENBLADE_EMULATOR_IMAGE:-ghcr.io/amantux/openblade-i3-emulator:0.1.0}
    profiles: ["emulator"]
    ports:
      - "8010:8010"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  openblade-data:
