[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openblade"
version = "0.1.0"
description = "OpenBlade DIY tape archive controller with simulator-first safety model"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "OpenBlade contributors"}]
dependencies = [
  "fastapi>=0.115",
  "a2wsgi>=1.10",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "typer==0.27.0",  # pinned: CI resolved a newer typer whose bare-group
  # invocation rendered a usage error instead of the callback, failing
  # test_restore_without_options_or_subcommand while the venv passed —
  # the same toolchain-skew class the ruff pin closed. Bump deliberately.
  "click==8.4.2",  # typer's engine; pinned with it
  "rich>=13",
  "pydantic>=2",
  "aiosqlite>=0.20",
  "structlog>=24.1",
  "httpx>=0.27",
  "pyotp>=2.9",
  "python-multipart>=0.0.9",
  # openblade.web_flask: the NAS-first operator UI. It is a WSGI app SEPARATE from
  # the FastAPI surface and reaches it over HTTP (web_flask.client.BackendClient),
  # so Flask is a runtime dependency rather than a dev one: Dockerfile.web serves
  # it under gunicorn, and a plain `pip install -e .` must be enough to import it.
  "flask>=3.0",
]

[project.optional-dependencies]
# `openblade fuse mount`. fusepy over pyfuse3 deliberately: it is pure Python
# (ctypes over libfuse2, no compiler or Cython at install time) and needs no
# async runtime, so the mount reuses the existing synchronous catalog and
# restore code unchanged. Requires libfuse2 and /dev/fuse on the host; the CLI
# degrades with a curated message when this extra is not installed.
fuse = [
  "fusepy>=3.0.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  # EXACT pin, not a floor. `ruff>=0.6` let CI resolve whatever was newest on
  # PyPI that morning while developer venvs sat on an older build, so `make lint`
  # and the backend-lint job enforced two different rule sets. Pinned to the
  # version the project venv already carries (verified: 0.15.22 and 0.16.7
  # produce byte-identical `ruff check` and `ruff format` results on this tree,
  # so the pin costs zero churn). Bump deliberately, in its own commit, after
  # re-running `ruff check . && ruff format --check .`.
  "ruff==0.15.22",
  # EXACT pin, for the same reason as ruff above, now that backend-typecheck is a
  # blocking gate: mypy adds error codes and tightens inference between minor
  # releases, so a floating `>=` would let a new upload turn a green tree red with
  # no commit behind it. Pinned to the version the zero-error baseline was cleared
  # against (verified: `mypy openblade` exits 0 on 2.3.0). Bump deliberately, in
  # its own commit, after re-running `mypy openblade`.
  "mypy==2.3.0",
  # Stubs for PyYAML (a transitive runtime dep via uvicorn[standard]), so
  # openblade/nas/sidecar.py type-checks without a blanket import ignore.
  # Pinned for the same reason as the two above: a stub release can introduce
  # errors in unchanged code, and backend-typecheck now blocks.
  "types-PyYAML==6.0.12.20260906",
  "asyncssh>=2.21",
  "pyfakefs>=5.6",
]

[project.scripts]
openblade = "openblade.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["openblade"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# EXPLICIT rule set — never rely on ruff's defaults, which widen between minor
# releases (this is why the version above is pinned exactly as well). Anything
# not listed here is OFF.
#
# BLE is now SELECTED, so every `# noqa: BLE001` in the tree is live and enforced
# rather than inert documentation. The policy behind those markers: a broad
# `except Exception` is legitimate only at a boundary whose job is to catch
# everything (job/step runners, CLI top level, health probes, content-negotiation
# fallbacks, best-effort probes and demo seeding, real-hardware test teardown).
# Each one carries a reason naming WHERE the error is logged and WHAT curated form
# escapes — `safe_job_error()` (openblade/domain/errors.py) for anything that
# reaches an unauthenticated field, a degraded status for health, a response
# header for content negotiation. A handler that can name its failure modes is
# narrowed instead; a handler that swallows silently is a bug, not a style issue.
#
# S stays deliberately UNSELECTED: 3,748 findings, overwhelmingly S101 (`assert`
# in tests, which is the point of tests). The `# noqa: S6xx/S3xx/S4xx` markers
# that used to sit in the tree pretending to be enforcement are now plain
# comments stating the safety property they documented (argv-list/`shell=False`
# discipline in scripts/deploy.py and the subprocess-based tests, the
# operator-supplied probe URL). Selecting S is still a separate, scoped decision
# — see docs/decisions/2026-09-11-pin-ruff-toolchain.md.
select = ["E", "F", "I", "B", "UP", "A", "SIM", "BLE"]
# A002 (argument shadows a builtin) is ignored: FastAPI path/query params like
# `id`, `type`, `filter` ARE the wire contract — renaming them would break the
# /aml endpoints (see docs/tech-debt.md).
ignore = ["A002", "A004", "B008", "B017", "E402", "E501", "UP017", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/hardware/*" = ["SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "real_hardware: tests requiring actual tape hardware",
  "slow: long-running simulator stress tests",
  "i3: Quantum i3 emulator and protocol tests",
  "real_i3: tests requiring a physical Quantum Scalar i3",
  "contract: behavioural contract suite run against every backend pairing",
  "protocols: containerised SMB/NFS protocol rig tests (make test-protocols)",
  "stress: fault-injection / stress tests (nightly stress lane)",
  "fuzz: property-based / fuzz tests (nightly fuzz lane)",
  "rebuild: catalog rebuild tests (nightly rebuild lane)",
  "mutation: tests used as the kill-set for the mutation lane",
]

[tool.mutmut]
# mutmut 3.x (verified against installed 3.8.0 configuration.py). Scope: the
# safety-critical modules; tools/mutation_run.sh selects a subset per run.
source_paths = ["openblade"]
only_mutate = [
  "openblade/domain/policies.py",
  "openblade/safety/*",
  "openblade/jobs/scheduler.py",
  "openblade/jobs/recovery.py",
  "openblade/domain/scalar_coordinate.py",
  "openblade/nas/manifest_validator.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
# tests/safety/test_assistant_read_only.py is excluded: it does not exercise the
# mutated modules and stalled >60s locally (2026-10-09), which blocks mutmut stats.
pytest_add_cli_args_test_selection = [
  "tests/safety/test_import_guard.py",
  "tests/safety/test_safety_regression.py",
  "tests/unit/test_scheduler.py",
  "tests/unit/test_drive_leases.py",
  "tests/unit/test_recovery.py",
  "tests/unit/test_scalar_coordinate.py",
  "tests/unit/test_manifest_validator.py",
  "tests/unit/test_import_guard.py",
  "tests/unit/test_safety_gates.py",
  "tests/unit/test_hardware_safety.py",
  "tests/unit/test_capacity_policy.py",
]
